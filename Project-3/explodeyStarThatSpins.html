<!DOCTYPE html>
<html>
    <head>
        <script src="initShaders.js"></script>

        <script id="vertex-shader" type="x-shader/x-vertex">
            uniform float N, t;
            void main() {
                if (gl_VertexID == 0){
                    gl_Position = vec4(0.0, 0.0, 0.0, 1.0);
                    return;
                }
                float radius = gl_VertexID % 2 == 0 ? 1.0 : 0.5;
                float vid = float(gl_VertexID -1);

                const float Pi = 3.14159265358979;
                float angle  = (vid * 2.0 * Pi / (N-2.0)) + 2.0 * t;
                vec2 v = sin(t) * radius * vec2(cos(angle), sin(angle)); //modify radius

                gl_Position = vec4(v, 0.0, 1.0);
            }
        </script>
        
        <script id="fragment-shader" type="x-shader/x-fragment">
            uniform float t;
            out vec4 fColor;
            void main() {
                float r = abs(sin(t));
                float g = abs(cos(t));
                float b = abs(sin(t) + cos(t));
                fColor = vec4(r, g, b, 1.0);
            }
        </script>

        <script>
            window.onload = () => {
                var canvas = document.getElementById("webgl");
                var gl = canvas.getContext("webgl2");

                gl.clearColor(0.1, 0.1, 0.1, 1.0);

                var program = initShaders(gl, "vertex-shader", "fragment-shader");
                
                
                var uN = gl.getUniformLocation(program, "N");
                var uTime = gl.getUniformLocation(program, "t");

                var t = 0.0;

                var render = () => {
                    t += 0.01;  // Tick time

                    gl.clear(gl.COLOR_BUFFER_BIT);
                    gl.useProgram(program);

                    const starPoints = 5;

                    const N = 2 + starPoints * 2; //number of verticies

                    
                    gl.uniform1f(uN, N);
                    gl.uniform1f(uTime, t);

                     gl.drawArrays(gl.TRIANGLE_FAN, 0, N);

                    requestAnimationFrame(render);
                };

                render();
            };
        </script>
    </head>

    <body>
        <canvas id="webgl" width="512" height="512"></canvas>
    </body>
</html>
